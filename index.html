<!doctype html>
<!-- lang="he" dir="rtl" on <html> makes the whole page right-to-left. -->
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>מדריך חזותי להדפסת תלת־ממד</title>
    <meta name="description" content="איך מדפסות תלת־ממד עובדות, במה החומרים שונים, ומה עושים כשהדפסה נכשלת." />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f9efeb" />
    <!-- favicon: three hand-stacked layers, as an inline SVG so there is no extra file to host -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f9efeb'/%3E%3Cg fill='%23d02c1f'%3E%3Crect x='7' y='20' width='18' height='5' rx='1.5'/%3E%3Crect x='8' y='13' width='16' height='5' rx='1.5'/%3E%3Crect x='9' y='6' width='14' height='5' rx='1.5'/%3E%3C/g%3E%3C/svg%3E" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">דלג לתוכן</a>
    <noscript><p style="padding:2rem;font-family:sans-serif">האתר דורש JavaScript כדי להציג את התוכן והאנימציות.</p></noscript>

    <!-- Hand-drawn look: this filter wobbles every line a little (SVG noise displacement).
         Applied in CSS with `filter: url(#wobble)` to the diagrams and the hero drawing. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" />
      </filter>
    </svg>

    <header class="site-nav" id="site-nav">
      <!-- The button and the full-screen index (#menu) are built in main.js from src/data/copy.js. -->
    </header>

    <main id="main">
      <!-- Each <section> below is filled by the module in src/sections/ with the same name.
           Order here = order on the page. -->
      <section id="hero" class="section section--hero"></section>
      <section id="overview" class="section"></section>
      <section id="workflow" class="section"></section>
      <section id="technologies" class="section"></section>
      <section id="fdmtypes" class="section"></section>
      <section id="supports" class="section"></section>
      <section id="infill" class="section"></section>
      <section id="industrial" class="section"></section>
      <section id="compare" class="section"></section>
      <section id="materials" class="section"></section>
      <section id="troubleshooting" class="section"></section>
      <section id="usecases" class="section"></section>
      <section id="wizard" class="section"></section>
    </main>

    <footer class="site-footer" id="footer"></footer>
  </body>
</html>
