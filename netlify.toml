# Netlify settings for the 3D printing guide. Drop this file in the project root (next to package.json).
# Netlify reads it automatically: connect the GitHub repo, no other settings needed.

[build]
  # TEST MODE: plain build, so you can deploy before the owner details in src/data/legal.js are filled in.
  # BEFORE GOING PUBLIC change this to:  npm run check:legal && npm run build
  # (check:legal stops the deploy while details are missing, so the accessibility statement never goes live with red "חסר" markers).
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite needs a recent Node version
  NODE_VERSION = "22"

# ---- Security headers (the site loads everything from its own address: no CDNs, no analytics) ----
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # TEST MODE: keep search engines away from the test site. DELETE THIS LINE when you go public.
    X-Robots-Tag = "noindex, nofollow"

# ---- Caching: built files have a fingerprint in their name, so they can be kept for a year ----
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
